<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С Днем Рождения!</title>

    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            color: #fff;
            background-color: #000; /* Fallback */
            display: flex; /* For centering screens */
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: background-image 1s ease-in-out;
            z-index: -1;
            /* Начальное фоновое изображение. Замените на ваше первое изображение. */
            background-image: url('e1219cd97fa4d1638c1aa9338a2db4b1.gif'); /* Пример GIF фона - заменил на GIF из первого запроса */
        }

        .screen {
            position: absolute; /* Changed from absolute to fixed relative to body */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease-in-out;
            box-sizing: border-box;
            padding: 20px;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        #initial-screen {
            cursor: pointer;
            background-color: rgba(0, 0, 0, 0.4);
            font-size: 3em;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
            font-family: 'Pacifico', cursive;
        }

        #cake-screen h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
            font-family: 'Caveat', cursive;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
                    position: relative;
        top: -30px; /* Поднимает заголовок на экране с тортом на 30px вверх */

        }

        #cake-elements-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            margin-top: -50px; /* Adjust if needed */
            flex-wrap: wrap; /* Allow wrapping on smaller screens */
        }

        #cake-image {
            max-width: 50%;
            max-height: 70vh;
            border-radius: 15px;
            pointer-events: auto;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        #cake-image:hover {
            transform: scale(1.02);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.9);
        }

        #rotating-gift-image {
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
            max-width: 30%;
            max-height: 50vh;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.7));
        }

        #rotating-gift-image.visible {
            opacity: 1;
            transform: scale(1);
            animation: spin 1s linear 1; /* 3 секунды, линейно, 5 раз */
        }

        @keyframes spin {
            from { transform: rotate(0deg) scale(1); }
            to { transform: rotate(360deg) scale(1); }
        }

        #message-screen {
            background-color: rgba(0, 0, 0, 0.4);
        }

        #congratulation-content {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            max-width: 90%;
            gap: 30px;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            transition: opacity 0.5s ease-in-out;
            box-sizing: border-box;
            flex-wrap: wrap;
            cursor: default; /* For messages, not clickable as a whole */
        }

        #congratulation-text-container {
            flex: 1;
            min-width: 300px;
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
        }

        #congratulation-text-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #congratulation-image {
            max-width: 300px;
            max-height: 300px;
            width: auto;
            height: auto;
            border-radius: 10px;
            object-fit: contain; /* Ensure image fits well */
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        #congratulation-text-container h2 {
            font-family: 'Pacifico', cursive;
            font-size: 2.2em;
            margin-bottom: 15px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
        }

        #message-text {
            font-family: 'Caveat', cursive;
            font-size: 1.5em;
            line-height: 1.6;
            min-height: 100px; /* To prevent layout shift */
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            margin-top: 10px;
        }

        #message-controls {
            margin-top: 30px;
            display: flex;
            gap: 20px;
        }

        .action-button {
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            background-color: #ff69b4; /* Hot pink */
            color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            font-family: 'Arial', sans-serif;
letter-spacing: 0.5px;
        }

        .action-button:hover {
            background-color: #ff4a9e; /* Darker pink */
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
        }

        .action-button:active {
            transform: translateY(0);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
        }

        #gift-button {
            background-color: #8a2be2; /* Blue violet */
        }
        #gift-button:hover {
            background-color: #7b22d1;
        }

        #gift-screen, #final-screen {
            background-color: rgba(0, 0, 0, 0.5);
        }

        #gift-container, #final-message-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 30px;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
            max-width: 90%;
            box-sizing: border-box;
        }

        #opened-gift-image, #final-message-image {
            max-width: 80%;
            max-height: 50vh;
            border-radius: 15px;
            object-fit: contain;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        #gift-message, #final-message-text {
            font-family: 'Caveat', cursive;
            font-size: 1.8em;
            text-align: center;
            line-height: 1.5;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
        }

        #final-message-text {
            font-family: 'Pacifico', cursive;
            font-size: 2.5em;
            color: #ffd700; /* Gold color for final message */
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.8);
        }

        #music-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 2px solid #fff;
            font-size: 1.5em;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease, border-color 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        #music-control:hover {
            background-color: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
            border-color: #ff69b4;
        }

        #music-control.playing {
            background-color: rgba(255, 105, 180, 0.5); /* Pink when playing */
        }

         @media (max-width: 768px) {
            #initial-screen {
                font-size: 2em;
            }
            #cake-screen h2 {
                font-size: 1.8em;
            }
            #cake-elements-container {
                flex-direction: column;
                gap: 20px;
            }
            #cake-image {
                max-width: 80%;
            }
            #rotating-gift-image {
                max-width: 50%;
            }
            #congratulation-content {
                flex-direction: column;
                max-width: 95%;
                gap: 15px;
                padding: 15px;
            }
            #congratulation-image {
                max-width: 200px;
                max-height: 200px;
            }
            #congratulation-text-container {
                min-width: unset;
                width: 100%;
            }
            #congratulation-text-container h2 {
                font-size: 1.8em;
            }
            #message-text {
                font-size: 1.2em;
                min-height: 80px;
            }
            #message-controls {flex-direction: column;
                gap: 15px;
                width: 100%;
            }
            .action-button {
                padding: 12px 20px;
                font-size: 1em;
                width: 100%;
            }
            #gift-container, #final-message-container {
                padding: 20px;
            }
            #opened-gift-image, #final-message-image {
                max-width: 90%;
            }
            #gift-message, #final-message-text {
                font-size: 1.4em;
            }
            #final-message-text {
                font-size: 2em;
            }
            #music-control {
                width: 40px;
                height: 40px;
                font-size: 1.2em;
                bottom: 15px;
                right: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Контейнер для смены фоновых изображений -->
    <div id="background-container"></div>

    <!-- Аудио плеер для фоновой музыки -->
    <audio id="background-music" loop>
        <source src="Ирина Аллегрова - С днем рождения.mp3" type="audio/mpeg">
        Ваш браузер не поддерживает аудио элемент.
    </audio>

    <!-- Кнопка управления музыкой -->
    <div id="music-control">
        &#9835; <!-- Музыкальная нота -->
    </div>

    <!-- 1. Начальный экран -->
    <div id="initial-screen" class="screen active">
        С Днем Рождения! Нажми, чтобы начать 🎉
    </div>

    <!-- 2. Экран с тортом -->
    <div id="cake-screen" class="screen">
        <h2>Поздравляю! Задуй свечи и загадай желание!</h2>
        <div id="cake-elements-container">
            <img id="cake-image" src="8fd1a752307eb9fd5cb566cff1b52bb7.png" alt="Торт с свечами">
            <img id="rotating-gift-image" src="photo_2025-12-04_22-09-01.jpg" alt="Вращающийся подарок">
        </div>
        <div id="message-controls">
            <button id="light-candles-button" class="action-button">Задуть свечи!</button>
        </div>
    </div>

    <!-- 3. Экран с сообщениями -->
    <div id="message-screen" class="screen">
        <div id="congratulation-content">
            <img id="congratulation-image" src="photo_2025-12-04_22-03-56.jpg" alt="Поздравительное изображение">
            <div id="congratulation-text-container">
                <h2 id="congratulation-title">С праздником!</h2>
                <p id="message-text">Подождите, сообщение загружается...</p>
            </div>
        </div>
        <div id="message-controls">
            <button id="next-message-button" class="action-button">Далее</button>
            <button id="gift-button" class="action-button" style="display: none;">Открыть подарок!</button>
        </div>
    </div>

    <!-- 4. Экран с подарком (откроется после нажатия на кнопку "Открыть подарок") -->
    <div id="gift-screen" class="screen">
        <div id="gift-container">
            <img id="opened-gift-image" src="e1219cd97fa4d1638c1aa9338a2db4b1.gif" alt="Открытый подарок">
            <p id="gift-message">Это твой подарок! Надеюсь, он тебе понравится!</p>
            <button id="continue-from-gift" class="action-button">Продолжить поздравление</button>
        </div>
    </div>

    <!-- 5. Финальный экран -->
    <div id="final-screen" class="screen">
        <div id="final-message-container">
            <img id="final-message-image" src="e1219cd97fa4d1638c1aa9338a2db4b1.gif" alt="Финальное изображение">
            <p id="final-message-text">С Днем Рождения! Желаю счастья, здоровья и исполнения всех желаний!</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ==================== Элементы DOM ====================
            const backgroundContainer = document.getElementById('background-container');
            const initialScreen = document.getElementById('initial-screen');
            const cakeScreen = document.getElementById('cake-screen');
            const messageScreen = document.getElementById('message-screen');
            const giftScreen = document.getElementById('gift-screen');
            const finalScreen = document.getElementById('final-screen');

            const cakeImage = document.getElementById('cake-image');
            const rotatingGiftImage = document.getElementById('rotating-gift-image');
            const lightCandlesButton = document.getElementById('light-candles-button');

            const congratulationImage = document.getElementById('congratulation-image');
            const congratulationTitle = document.getElementById('congratulation-title');
            const messageText = document.getElementById('message-text');
            const nextMessageButton = document.getElementById('next-message-button');
            const giftButton = document.getElementById('gift-button');
            
            const openedGiftImage = document.getElementById('opened-gift-image');
            const giftMessage = document.getElementById('gift-message');
            const continueFromGiftButton = document.getElementById('continue-from-gift');

            const finalMessageImage = document.getElementById('final-message-image');
            const finalMessageText = document.getElementById('final-message-text');

            const backgroundMusic = document.getElementById('background-music');
            const musicControl = document.getElementById('music-control');

            // ==================== Переменные состояния ====================
            let currentScreenId = 'initial-screen';
            let currentMessageIndex = 0;
            let cakeLit = false;
            let isMusicPlaying = false;
            let typewriterEffectInstance = null; // Для управления эффектом печати

            const screens = {
                'initial-screen': initialScreen,
                'cake-screen': cakeScreen,
                'message-screen': messageScreen,
                'gift-screen': giftScreen,
                'final-screen': finalScreen
            };

            const backgroundImages = [
               
                'e1219cd97fa4d1638c1aa9338a2db4b1.gif' // И еще
                // Добавьте больше ссылок на GIF или изображения
            ];
            let currentBgIndex = 0;

            const messages = [
                {
                    title: "Моя дорогая!",
                    text: "Сегодня особенный день, и я хочу, чтобы он был наполнен радостью, смехом и незабываемыми моментами, прям как на твое 18-летие!",
                    image: "photo_2025-12-04_22-02-54.jpg"
                },
                {
                    title: "Желаю тебе...",
                    text: "Больше ярких моментов в твоей жизни, сдать сессии на 5 и чтоб никогда не грустила =3",
                    image: "photo_2025-12-04_22-03-56.jpg"
                },
                {
                    title: "Помни о главном!",
                    text: "Я люблю, ценю и дорожу тебя, даже когда ты постарела на целый год!",
                    image: "photo_2025-12-05_13-06-47.jpg"
                },
                {
                    title: "Ещё раз с днем рождения!",
                    text: "Но какое же день рождения без подарков? Приготовься к сюрпризу!",
                    image: "photo_2025-12-04_22-06-37.jpg",
                    action: "show_gift_button" // Специальное действие для этого сообщения
                }
            ];

            // ==================== Функции ====================

            function showScreen(id) {
                Object.values(screens).forEach(screen => {
                    screen.classList.remove('active');
                });
                screens[id].classList.add('active');
                currentScreenId = id;
            }

            function changeBackground() {
                currentBgIndex = (currentBgIndex + 1) % backgroundImages.length;
                backgroundContainer.style.backgroundImage = `url('${backgroundImages[currentBgIndex]}')`;
            }

            function playAudio() {
                backgroundMusic.play().then(() => {
                    isMusicPlaying = true;
                    musicControl.classList.add('playing');
                    musicControl.innerHTML = '&#10074;&#10074;'; // Иконка паузы
                }).catch(error => {
                    console.error("Автовоспроизведение музыки заблокировано:", error);
                    // Возможно, показать кнопку "Разрешить звук"
                });
            }

            function pauseAudio() {
                backgroundMusic.pause();
                isMusicPlaying = false;
                musicControl.classList.remove('playing');
                musicControl.innerHTML = '&#9835;'; // Иконка ноты
            }

            function toggleMusic() {
                if (isMusicPlaying) {
                    pauseAudio();
                } else {
                    playAudio();
                }
            }

            function typeWriterEffect(element, text, speed, callback) {
                let i = 0;
                element.innerHTML = ''; // Очищаем текст перед началом
                typewriterEffectInstance = setInterval(() => {
                    if (i < text.length) {
                        element.innerHTML += text.charAt(i);
                        i++;
                    } else {
                        clearInterval(typewriterEffectInstance);
                        typewriterEffectInstance = null;
                        if (callback) callback();
                    }
                }, speed);
            }

            function stopTypeWriterEffect() {
                if (typewriterEffectInstance) {
                    clearInterval(typewriterEffectInstance);
                    typewriterEffectInstance = null;
                }
            }

            function startBirthdaySequence() {
                showScreen('cake-screen');
                setInterval(changeBackground, 7000); // Меняем фон каждые 7 секунд// Аудио будет запущено по первому взаимодействию
            }

            function lightCandles() {
                if (!cakeLit) {
                    // Визуальный эффект задувания свечей (можно поменять изображение торта, добавить анимацию)
                    // Для примера просто меняем источник изображения на торт без свечей или с дымом
                    cakeImage.src = "8fd1a752307eb9fd5cb566cff1b52bb7.png"; // Торт без свечей
                    cakeImage.alt = "Торт без свечей";
                    
                    rotatingGiftImage.classList.add('visible'); // Показываем вращающийся подарок
                    lightCandlesButton.style.display = 'none'; // Скрываем кнопку "Задуть свечи"
                    nextMessageButton.style.display = 'block'; // Показываем кнопку "Далее"
                    
                    cakeLit = true;
                    setTimeout(() => {
                        // После анимации торта и подарка переходим к сообщениям
                        showScreen('message-screen');
                        displayMessage();
                    }, 4000); // 5 секунд, чтобы посмотреть на вращающийся подарок
                }
            }

            function displayMessage() {
                stopTypeWriterEffect(); // Остановить текущий эффект печати, если есть

                if (currentMessageIndex >= messages.length) {
                    showFinalMessage();
                    return;
                }

                const message = messages[currentMessageIndex];

                // Обновляем содержимое
                congratulationTitle.textContent = message.title;
                congratulationImage.src = message.image;
                
                // Скрываем текст, чтобы плавно обновить
                messageText.style.opacity = 0; 
                setTimeout(() => {
                    typeWriterEffect(messageText, message.text, 50, () => {
                        // После завершения печати, показать кнопки
                        if (message.action === "show_gift_button") {
                            giftButton.style.display = 'inline-block';
                            nextMessageButton.style.display = 'none'; // Можно скрыть "Далее", чтобы пользователь открыл подарок
                        } else {
                            giftButton.style.display = 'none';
                            nextMessageButton.style.display = 'inline-block';
                        }
                    });
                    messageText.style.opacity = 1;
                }, 300); // Небольшая задержка для эффекта плавного появления текста

                currentMessageIndex++;
            }

            function openGift() {
                showScreen('gift-screen');
                // Здесь можно настроить сообщение и изображение подарка
                openedGiftImage.src = "1351231_1740258984_6934fea9-fca4-48a6-8852-8a546e1884fe.jpg"; // Пример открытого подарка GIF
                giftMessage.textContent = "Твой подарок! Поздравляю, ты будешь мамой!";
            }

            function showFinalMessage() {
                showScreen('final-screen');
                finalMessageImage.src = "e1219cd97fa4d1638c1aa9338a2db4b1.gif"; // Пример финального GIF
                finalMessageText.textContent = "Пусть каждый день будет полон смеха, любви и счастья! С Днем Рождения!";
                // Можно остановить смену фона, если это финальный экран
                // clearInterval(backgroundInterval); 
            }

            // ==================== Обработчики событий ====================

            initialScreen.addEventListener('click', () => {
                startBirthdaySequence(
);
                if (!isMusicPlaying) {
                    playAudio(); // Запускаем музыку при первом взаимодействии
                }
            });

            lightCandlesButton.addEventListener('click', lightCandles);

            nextMessageButton.addEventListener('click', displayMessage);

            giftButton.addEventListener('click', openGift);

            continueFromGiftButton.addEventListener('click', () => {
                showScreen('message-screen');
                displayMessage(); // Продолжаем с следующего сообщения
            });

            musicControl.addEventListener('click', toggleMusic);

            // Инициализация: показать первый экран
            showScreen('initial-screen');
            nextMessageButton.style.display = 'none'; // Скрываем кнопку "Далее" до задувания свечей
        });
    </script>
</body>
</html>
